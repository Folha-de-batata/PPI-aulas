<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        *{border: 1px solid black;}
        div{display: inline-block;
        height: 50px;
        width: 70px;}
        p{display: none;}
        span{display: inline-block;
        width: 50px;}
        #container{
            width: 100%;
            height: 1000px;
        }
        .box{display: inline-block}
        #box1{background-color: red;
        position: relative;
        top: 100px;
        left: 55px;}
        #box2{background-color: orange;
        position: relative;
        top: 70px;
        left: 35px;}
        #box3{background-color: yellow;
        position: relative;
        top: 50px;
        left: 15px;}
        #box4{background-color: green;
        position: relative;
        top: 30px;
        left: -5px;}
        #box5{background-color: blue;
        position: relative;
        top: 50px;
        left: -20px;}
        #box6{background-color: indigo;
        position: relative;
        top: 70px;
        left: -40px;}
        #box7{background-color: purple;
        position: relative;
        top: 100px;
        left: -65px;}
        #box8{
            background-color: rgba(255, 0, 0, 1);
            position: fixed;
            z-index: 3;}
        #box9{
            background-color: rgba(255, 255, 0, 1);
            z-index: 1;}
        #box10{
            position: absolute;
            top: 0px;
            left: 0px;}
    </style>
</head>
<body>
    <div>Lorem div</div>
    <div>Lorem div</div>
    <p>Lorem p</p>
    <p>Lorem p</p>
    <span>Lorem span</span>
    <span>Lorem span</span>

    <hr>
    <h2>Positions</h2>
    <div id="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
        <div class="box" id="box6">box6</div>
        <div class="box" id="box7">box7</div>
        <div class="box" id="box8">box8</div>
        <div class="box" id="box9">box9</div>
        <div class="box" id="box10">box10</div>
        <div class="box" id="box11">box11</div>

    </div>
</body>
</html>
