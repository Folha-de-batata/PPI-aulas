<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    div{border: 5px solid black;}
    .box{border: 2px solid pink;
    display: inline-block;
    height: 50px;
    width: 100px;}
    #box1{position: fixed;
    left: 0px;
    top: 0px;
    background-color: blueviolet;}
    #box2{position: fixed;
    top: 0px;
    right: 0px;
    background-color: green;}
    #box3{position: fixed;
    bottom: 0px;
    left: 0px;
    background-color: black;}
    #box4{position: fixed;
    bottom: 0px;
    right: 0px;
    background-color: blue;}
    #box5{position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);}  
    
    </style>
</head>
<body>
    <h1>Positions</h1>
    <div class="container">
        <div id="box1" class="box">box1</div>
        <div id="box2" class="box">box2</div>
        <div id="box3" class="box">box3</div>
        <div id="box4" class="box">box4</div>
        <div id="box5" class="box">box5</div>
    </div> 
</body>
</html>
